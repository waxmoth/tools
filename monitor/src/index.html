<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pageTitle">系统资源监控</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/app.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="brand">
        <img class="mark" src="assets/icon.svg" alt="" width="48" height="48">
        <div>
          <p class="eyebrow" id="host" data-i18n="hostPlaceholder">本机</p>
          <h1 data-i18n="title">系统资源</h1>
          <p class="sub" id="subtitle" data-i18n="loading">正在读取 CPU 与 GPU…</p>
        </div>
      </div>
      <div class="tools">
        <div class="lang" role="group" data-i18n-aria="language" aria-label="语言">
          <button type="button" data-lang="zh" aria-pressed="true">中文</button>
          <button type="button" data-lang="en" aria-pressed="false">English</button>
        </div>
        <div class="live" id="live">
          <span class="dot"></span>
          <span id="live-text" data-i18n="connecting">连接中</span>
        </div>
      </div>
    </header>

    <section class="metrics" id="metrics"></section>

    <div class="ranges" id="ranges" role="group" data-i18n-aria="historyRange" aria-label="时间范围">
      <button type="button" data-range="60" data-i18n="range60">60 秒</button>
      <button type="button" data-range="900" data-i18n="range900">15 分钟</button>
      <button type="button" data-range="3600" data-i18n="range3600">1 小时</button>
      <button type="button" data-range="21600" data-i18n="range21600">6 小时</button>
      <button type="button" data-range="86400" data-i18n="range86400">24 小时</button>
      <button type="button" data-range="604800" data-i18n="range604800">7 天</button>
    </div>

    <section class="charts">
      <article class="panel">
        <div class="panel-head">
          <h2>CPU</h2>
          <div class="panel-tools">
            <p id="cpu-chart-label" data-i18n="cpuChartIdle">占用率</p>
            <button type="button" class="zoom-open" data-zoom="cpu" data-i18n="zoom">放大</button>
          </div>
        </div>
        <canvas id="cpu-chart"></canvas>
      </article>
      <article class="panel">
        <div class="panel-head">
          <h2>GPU</h2>
          <div class="panel-tools">
            <p id="gpu-chart-label" data-i18n="gpuChartIdle">占用与功耗</p>
            <button type="button" class="zoom-open" data-zoom="gpu" data-i18n="zoom">放大</button>
          </div>
        </div>
        <canvas id="gpu-chart"></canvas>
        <div class="legend">
          <span class="gpu"><i></i><span data-i18n="usage">占用</span></span>
          <span class="power"><i></i><span data-i18n="powerOfLimit">功耗 / 上限</span></span>
        </div>
      </article>
    </section>

    <section class="detail">
      <article class="panel">
        <div class="panel-head">
          <h2 data-i18n="threads">每个线程</h2>
          <p id="thread-meta"></p>
        </div>
        <div class="threads" id="threads"></div>
      </article>
      <article class="panel">
        <div class="panel-head">
          <h2 data-i18n="gpuPanel">显卡</h2>
          <p id="gpu-meta" data-i18n="gpuMeta">功耗、显存、温度</p>
        </div>
        <div id="gpu-detail"></div>
      </article>
    </section>

    <p class="error" id="error" hidden></p>
  </div>

  <dialog class="zoom" id="zoom">
    <div class="zoom-card">
      <div class="zoom-head">
        <div>
          <h2 id="zoom-title">CPU</h2>
          <p id="zoom-note"></p>
        </div>
        <button type="button" class="zoom-open" id="zoom-close" data-i18n="close">关闭</button>
      </div>
      <form class="zoom-filter" id="zoom-filter">
        <label>
          <span data-i18n="from">从</span>
          <input id="zoom-start" type="datetime-local" step="1" required>
        </label>
        <label>
          <span data-i18n="to">到</span>
          <input id="zoom-end" type="datetime-local" step="1" required>
        </label>
        <button type="submit" data-i18n="applyRange">查看</button>
      </form>
      <div class="zoom-summary" id="zoom-summary"></div>
      <div class="legend" id="zoom-legend"></div>
      <div class="zoom-plot">
        <canvas id="zoom-chart"></canvas>
        <div id="zoom-tip" hidden></div>
      </div>
      <p class="note" data-i18n="zoomHint">在图上按住拖动，可以框选一段时间。</p>
    </div>
  </dialog>
  <script src="i18n/zh.js"></script>
  <script src="i18n/en.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
