[package]
name = "sitbreak"
version = "0.1.0"
edition = "2021"
description = "Forced break reminder for X11"
license = "MIT"

[[bin]]
name = "sitbreak"
path = "src/main.rs"

[dependencies]
anyhow = "1"
fontdue = "0.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.8"
x11rb = { version = "0.13", features = ["dpms", "randr", "screensaver"] }
